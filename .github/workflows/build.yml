name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Cancel in-flight builds on the same PR / branch when a new push
  # arrives — only the latest commit matters for the required check.
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, made explicit — closes zizmor's excessive-permissions
# finding ahead of the fleet-wide zizmor gate (akira-toriyama/.github t-qbp1).
permissions:
  contents: read

jobs:
  build:
    # macos-26: facet's floor is macOS 26 (t-tbar), and `swift test` runs
    # minos-26 binaries a macos-15 host can't load. The 26 runner defaults
    # to Xcode 26.x, which the shared swift-build composite consumes.
    runs-on: macos-26
    # Bounded so a hung `swift build` can't burn 6 h of free macOS minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Build-only: swift-build and package.sh read and write locally —
          # package.sh's `git describe` needs no credential and nothing here
          # pushes. Drop the persisted checkout token. t-yaxa
          persist-credentials: false

      # Shared Swift build (setup-xcode + SPM cache + build + test).
      - uses: akira-toriyama/.github/actions/swift-build@v2.1.2

      - name: Assemble & ad-hoc sign app bundle
        env:
          CODESIGN_ID: "-"
        run: ./package.sh

  # swift-bite — this pull request's new/changed Swift tests (XCTest and
  # swift-testing alike) run against the source BEFORE the pull request, and
  # the job fails when every one of them still passes: a test that would have
  # been green without the fix it accompanies is not evidence. It stands down,
  # green and explained, when there is nothing to prove — safe as a required
  # check. Verdict rules and the two opt-outs (`bite-exempt: <reason>` above a
  # test / a `Bite-exempt:` commit trailer): akira-toriyama/.github
  # docs/swift-bite.md. Live-ammunition record: swift-toml-edit#29.
  bite:
    uses: akira-toriyama/.github/.github/workflows/swift-bite.yml@v2
