name: Deploy glossary site

# Builds a dedicated SPA from this repo's docs/glossary.md and publishes it
# to https://akira-toriyama.github.io/facet/. The substance (builder +
# viewer) is delegated to akira-toriyama/glossary-site's reusable workflow.
#
# - push to main → build + deploy
# - pull_request → build only (artifact inspectable, no deploy)
# - workflow_dispatch → build + deploy

on:
  push:
    branches: [main]
    paths:
      - docs/glossary.md
      - .github/workflows/glossary.yml
  pull_request:
    paths:
      - docs/glossary.md
      - .github/workflows/glossary.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR and main in separate groups (a PR build never drags in a main deploy)
  group: pages-${{ github.event.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: akira-toriyama/glossary-site/.github/workflows/deploy.yml@main
